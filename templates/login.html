<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        // apply stored theme before first paint to avoid a flash
        (function () {
            try {
                var t = localStorage.getItem('wgui-theme');
                if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>WireGuard UI</title>
    <!-- Tell the browser to be responsive to screen width -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Favicon -->
    <link rel="icon" href="{{.basePath}}/favicon">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="{{.basePath}}/static/plugins/fontawesome-free/css/all.min.css">
    <!-- icheck bootstrap -->
    <link rel="stylesheet" href="{{.basePath}}/static/plugins/icheck-bootstrap/icheck-bootstrap.min.css">
    <!-- Theme style -->
    <link rel="stylesheet" href="{{.basePath}}/static/dist/css/adminlte.min.css">
    <!-- Theme (must load after adminlte) -->
    <link rel="stylesheet" href="{{.basePath}}/static/custom/css/theme.css">
</head>

<body class="hold-transition login-page">
    <button type="button" class="wg-theme-toggle" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <i class="fas fa-moon wg-icon-moon"></i><i class="fas fa-sun wg-icon-sun"></i>
    </button>
    <div class="login-box">
        <div class="login-logo">
            <a href="https://github.com/ngoduykhanh/wireguard-ui"><span class="wg-brand-mark"><i class="fas fa-shield-alt"></i></span>WireGuard UI</a>
        </div>
        <!-- /.login-logo -->
        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Sign in to start your session</p>
                <form action="" method="post">
                    <div class="input-group mb-3">
                        <input id="username" type="text" class="form-control" placeholder="Username">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-user"></span>
                            </div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input id="password" type="password" class="form-control" placeholder="Password">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row align-items-center">
                        <div class="col-7">
                            <div class="icheck-primary">
                                <input type="checkbox" id="remember">
                                <label for="remember">
                                    Remember Me
                                </label>
                            </div>
                        </div>
                        <!-- /.col -->
                        <div class="col-5">
                            <button id="btn_login" type="submit" class="btn btn-primary btn-block">Sign In</button>
                        </div>
                        <!-- /.col -->
                    </div>
                </form>
                <div class="text-center mb-3">
                    <p id="message"></p>
                </div>
            </div>
            <!-- /.login-card-body -->
        </div>
    </div>
    <!-- /.login-box -->
    <!-- jQuery -->
    <script src="{{.basePath}}/static/plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="{{.basePath}}/static/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- AdminLTE App -->
    <script src="{{.basePath}}/static/dist/js/adminlte.min.js"></script>
    <script>
        (function () {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            btn.addEventListener('click', function () {
                var root = document.documentElement;
                var current = root.getAttribute('data-theme');
                if (current !== 'dark' && current !== 'light') {
                    current = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                var next = current === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('wgui-theme', next); } catch (e) {}
            });
        })();
    </script>

</body>
<script>
    function redirectNext() {
        const urlParams = new URLSearchParams(window.location.search);
        const nextURL = urlParams.get('next');
        if (nextURL && /(?:^\/[a-zA-Z_])|(?:^\/$)/.test(nextURL.trim())) {
            window.location.href = nextURL;
        } else {
            window.location.href = '/{{.basePath}}';
        } 
    }
</script>
<script>
    $(document).ready(function () {
        $('form').on('submit', function(e) {
            e.preventDefault();
            $("#btn_login").trigger('click');
        });

        $("#btn_login").click(function () {
            const username = $("#username").val();
            const password = $("#password").val();
            let rememberMe = false;
            if ($("#remember").is(':checked')){
                rememberMe = true;
            }
            const data = {"username": username, "password": password, "rememberMe": rememberMe}

            $.ajax({
                cache: false,
                method: 'POST',
                url: '{{.basePath}}/login',
                dataType: 'json',
                contentType: "application/json",
                data: JSON.stringify(data),
                success: function(data) {
                    document.getElementById("message").innerHTML = `<p style="color:green">${data['message']}</p>`;
                    // redirect after logging in successfully
                    redirectNext();
                },
                error: function(jqXHR, exception) {
                    const responseJson = jQuery.parseJSON(jqXHR.responseText);
                    document.getElementById("message").innerHTML = `<p style="color:#ff0000">${responseJson['message']}</p>`;
                }
            });
        });
    });
</script>
</html>
